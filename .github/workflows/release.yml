# Builds the Chrome and Firefox packages on every push to the release branch and
# publishes them as a GitHub Release tagged v<package.json version>.
# Optional secret CRX_KEY: contents of the .pem signing key, to also build a .crx.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm test

      - name: Build Chrome package
        run: npm run zip

      - name: Build Firefox package
        run: npm run zip:firefox

      - name: Build CRX
        env:
          CRX_KEY_PEM: ${{ secrets.CRX_KEY }}
        if: env.CRX_KEY_PEM != ''
        run: |
          printf '%s\n' "$CRX_KEY_PEM" > "$RUNNER_TEMP/key.pem"
          CRX_KEY="$RUNNER_TEMP/key.pem" npm run crx
          rm -f "$RUNNER_TEMP/key.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: pretty-enough-themes-${{ steps.version.outputs.version }}
          path: package/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: package/*
          fail_on_unmatched_files: true
