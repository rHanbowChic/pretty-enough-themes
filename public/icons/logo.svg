<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PET (Pretty Enough Themes): a puppy making a :3 face. public/icons/logo-16.svg is the 16px version. -->
  <g stroke="#3a2418" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- floppy ears -->
    <path d="M36 28 C16 24 4 46 8 72 C10 86 22 90 30 80 C36 70 40 50 44 36 Z" fill="#a8683c"/>
    <path d="M92 28 C112 24 124 46 120 72 C118 86 106 90 98 80 C92 70 88 50 84 36 Z" fill="#a8683c"/>
    <!-- head -->
    <path d="M64 24 C94 24 112 44 112 72 C112 98 92 114 64 114 C36 114 16 98 16 72 C16 44 34 24 64 24 Z" fill="#f2c48d"/>
  </g>
  <!-- muzzle and forehead blaze -->
  <path d="M64 30 C58 40 56 56 58 72 L70 72 C72 56 70 40 64 30 Z" fill="#fff4e4"/>
  <ellipse cx="64" cy="90" rx="24" ry="17" fill="#fff4e4"/>
  <!-- blush -->
  <ellipse cx="32" cy="88" rx="9" ry="5.5" fill="#ff8f9c" opacity="0.75"/>
  <ellipse cx="96" cy="88" rx="9" ry="5.5" fill="#ff8f9c" opacity="0.75"/>
  <g stroke="#e86a7a" stroke-width="1.8" stroke-linecap="round">
    <path d="M28 90 L31 85 M33 90 L36 85"/>
    <path d="M92 90 L95 85 M97 90 L100 85"/>
  </g>
  <!-- eyes: big, glossy -->
  <g fill="#2a1a12">
    <ellipse cx="42" cy="70" rx="8.5" ry="11"/>
    <ellipse cx="86" cy="70" rx="8.5" ry="11"/>
  </g>
  <g fill="#ffffff">
    <circle cx="45" cy="65" r="3.6"/>
    <circle cx="89" cy="65" r="3.6"/>
    <circle cx="39.5" cy="75" r="1.8"/>
    <circle cx="83.5" cy="75" r="1.8"/>
  </g>
  <!-- nose and the :3 (ω) mouth -->
  <path d="M57 80 Q64 76 71 80 Q69 86 64 87 Q59 86 57 80 Z" fill="#2a1a12" stroke="#2a1a12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 87 L64 90 M50 89 Q57 100 64 90 Q71 100 78 89" fill="none" stroke="#3a2418" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
